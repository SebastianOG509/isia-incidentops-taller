[project]
name = "incidentops"
version = "0.2.0"
description = "IncidentOps — triaje, SLA y ciclo de vida de incidentes con Arquitectura Hexagonal (Semana 2 ISIA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
